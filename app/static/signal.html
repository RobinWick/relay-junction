<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Recount Signal</title>
<meta name="description" content="Rank companies, funds and founders on Cala's funding record. Every score shows its parts, weights and the records behind them.">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/static/fonts/instrument-sans-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/geist-mono-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/signal.css?v=2">
<script src="/static/signal.js?v=2"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar" id="topbar">
  <div class="topbar__left">
    <a class="brand" href="#/companies" aria-label="Recount Signal home">
      <span class="brand__tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12h3l3-7 4 14 3-7h5"/></svg></span>
      <span class="brand__word">Recount <span>Signal</span></span>
    </a>
    <a class="back-link" href="/explore" title="Back to Recount Explore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span>Recount</span></a>
  </div>
  <div class="topbar__nav"><nav class="seg seg--ink" id="nav" aria-label="Views"></nav></div>
  <div class="topbar__right">
    <button class="search-pill" id="open-pal" type="button" aria-label="Search companies, funds and founders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="kbd">⌘</span><span class="kbd">K</span></button>
    <div class="seg seg--sm theme-seg" id="theme-seg" role="group" aria-label="Theme"></div>
    <button class="icon-btn" id="open-key" type="button" aria-label="Use your own Gemini key" title="Use your own Gemini key"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.3-9.3M17 6l3 3M14.5 8.5l2 2"/></svg><span class="icon-btn__dot" id="key-dot" hidden></span></button>
  </div>
</header>
<main class="page" id="main" tabindex="-1"></main>
<nav class="tabbar" id="tabbar" aria-label="Views"></nav>
<div id="layer"></div>
</body>
</html>
